name: CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch>=2.3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
      - name: Validate shell syntax and sample evaluation
        run: |
          bash -n participant/start.sh
          python dev/evaluate.py examples/predictions.jsonl --gt examples/targets.jsonl --output outputs/example_metrics.json
